  detail: >-
    Takeoff's API is real and live but has no public face at all: api.takeoff.com
    holds a Google Trust Services certificate reissued 2026-07-16 and answers
    {"code":"401", "message":"Missing authentication header."} on /auth and
    /sites and {"message":"Forbidden"} on /webhooks and /identity, yet it names
    no header, serves no OAuth metadata and 404s every spec path, while the
    company's own marketing site www.takeoff.com has had no TLS certificate
    provisioned at its Webflow origin since the 2024 Chapter 11 and Woolworths
    asset sale — so integration docs exist only for deployed grocer tenants.
