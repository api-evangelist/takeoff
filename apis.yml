aid: takeoff
name: TakeOff
description: >-
  Takeoff Technologies, Inc. is an eGrocery micro-fulfillment company founded in
  2016 and headquartered in Waltham, Massachusetts. It paired KNAPP-built robotic
  storage-and-retrieval hardware with its own cloud software stack — order
  management, inventory, pick routing, labor management, and delivery
  orchestration — into micro-fulfillment centers (MFCs) installed inside or beside
  existing supermarkets, so grocers could assemble online orders in minutes
  instead of sending shoppers down the aisles. Customers and partners included
  Albertsons, Wakefern Food Corp., Woolworths Group and Chilean grocer SMU. The
  company filed for Chapter 11 in May 2024 and Woolworths Group acquired its
  micro-fulfillment assets in August 2024. Takeoff never published a public
  developer program: there is no developer portal, API reference, SDK or
  machine-readable specification anywhere on its public surface, and the marketing
  site at www.takeoff.com no longer serves TLS. A closed API gateway at
  api.takeoff.com remains live and actively certificate-maintained, serving
  customer integrations behind authentication.
